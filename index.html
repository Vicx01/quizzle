<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quizzle AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out forwards',
              'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
              'slide-in-right': 'slideInRight 0.4s ease-out forwards',
              'scale-in': 'scaleIn 0.3s ease-out forwards',
            }
          }
        }
      }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
      }

      body { 
        font-family: 'Inter', sans-serif;
        /* Global transition for text and background colors */
        transition: background-color 0.3s var(--ease-in-out), color 0.3s var(--ease-in-out);
      }
      
      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.7); }
      .dark ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); }
      .dark ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

      /* Base Glass Styles */
      .glass-panel, .glass-card, .glass-input {
        transition-property: background-color, border-color, box-shadow, color, opacity, transform;
        transition-duration: 0.3s;
        transition-timing-function: var(--ease-in-out);
      }

      .glass-panel {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(0, 0, 0, 0.1);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      }
      
      .glass-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(0, 0, 0, 0.08);
      }
      
      .glass-input {
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(4px);
        color: #111827;
      }
      .glass-input:focus {
        background: #ffffff;
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }
      .glass-input::placeholder { color: #6b7280; }

      /* Dark Mode Overrides */
      .dark .glass-panel {
        background: rgba(17, 24, 39, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: none;
      }
      
      .dark .glass-card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      
      .dark .glass-input {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #f3f4f6;
      }
      .dark .glass-input:focus {
        background: rgba(0, 0, 0, 0.5);
        border-color: rgba(59, 130, 246, 0.5);
        box-shadow: none;
      }
      .dark .glass-input::placeholder { color: #9ca3af; }

      /* Refined Animations */
      
      /* Subtle Fade In (No movement) - Good for tab switches */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fadeIn 0.4s var(--ease-out-expo) forwards;
      }

      /* Fade In Up (With slight movement) - Good for content loading */
      @keyframes fadeInUp {
        0% { opacity: 0; transform: translate3d(0, 10px, 0); }
        100% { opacity: 1; transform: translate3d(0, 0, 0); }
      }
      .animate-fade-in-up {
        animation: fadeInUp 0.5s var(--ease-out-expo) forwards;
      }
      
      /* Slide In Right - Subtler */
      @keyframes slideInRight {
        0% { opacity: 0; transform: translate3d(15px, 0, 0); }
        100% { opacity: 1; transform: translate3d(0, 0, 0); }
      }
      .animate-slide-in-right {
        animation: slideInRight 0.4s var(--ease-out-expo) forwards;
      }

      /* Scale In - Elastic feel */
      @keyframes scaleIn {
        0% { opacity: 0; transform: scale(0.95); }
        100% { opacity: 1; transform: scale(1); }
      }
      .animate-scale-in {
        animation: scaleIn 0.4s var(--ease-out-expo) forwards;
      }
      
      /* Splash Logo */
      @keyframes splashLogoEnter {
        0% { opacity: 0; transform: scale(0.8) rotate(-5deg); }
        100% { opacity: 1; transform: scale(1) rotate(0); }
      }
      .animate-splash-logo {
        animation: splashLogoEnter 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      /* Utility for staggering */
      .delay-100 { animation-delay: 100ms; }
      .delay-200 { animation-delay: 200ms; }
      .delay-300 { animation-delay: 300ms; }
      .delay-500 { animation-delay: 500ms; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.32.0"
  }
}
</script>
</head>
  <body class="bg-gray-100 dark:bg-slate-900 text-gray-900 dark:text-gray-100 antialiased h-screen overflow-hidden">
    <div id="root" class="h-full flex flex-col"></div>
  </body>
</html>
